# 每周一检查一次来源栏里的链接还能不能打开
name: links

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-links.mjs
